[package]
name = "tmux-workspace-expose"
version = "0.1.0"
edition = "2024"
description = "Browse tmux sessions, windows, and panes in a workspace overview"
license = "MIT"
publish = false
repository = "https://github.com/Nobody-Cares-TXSL/tmux-workspace-expose"
homepage = "https://github.com/Nobody-Cares-TXSL/tmux-workspace-expose"
readme = "README.md"
keywords = ["tmux", "terminal", "tui", "session", "switcher"]
categories = ["command-line-utilities"]

[lib]
name = "tmux_expose"

[[bin]]
name = "tmux-workspace-expose"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.28"
